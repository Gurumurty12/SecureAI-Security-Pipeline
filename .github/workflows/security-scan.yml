```yaml
name: SecureAI Security Scans

'on':
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit semgrep pylint pip-audit

      - name: Create report directory
        run: mkdir -p security-reports

      - name: Bandit scan
        id: bandit
        continue-on-error: true
        run: |
          bandit -r src -f json -o security-reports/bandit-results.json
          bandit -r src --severity-level high

      - name: Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan --config auto src --json --output security-reports/semgrep-results.json
          semgrep scan --config auto src --severity ERROR

      - name: PyLint scan
        continue-on-error: true
        run: |
          pylint src/*.py --disable=all --enable=W,E > security-reports/pylint-results.txt

      - name: Dependency scan
        id: dependencies
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt -f json -o security-reports/pip-audit-results.json

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureai-scan-results
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce blocking scan gates
        if: always()
        run: |
          if [ "${{ steps.bandit.outcome }}" = "failure" ] || [ "${{ steps.semgrep.outcome }}" = "failure" ] || [ "${{ steps.dependencies.outcome }}" = "failure" ]; then
            echo "Security scan failed. Review the uploaded reports."
            exit 1
          fi
```